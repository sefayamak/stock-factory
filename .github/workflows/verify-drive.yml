name: Stock Factory - verify Drive connectivity (manual, non-production)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_ADOBE_FOLDER_ID: ${{ vars.DRIVE_ADOBE_FOLDER_ID }}
      DRIVE_MAGNIFIC_FOLDER_ID: ${{ vars.DRIVE_MAGNIFIC_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Real (non-mocked) Drive connectivity + token-refresh check
        shell: bash
        env:
          PYTHONPATH: src
        run: python3 scripts/verify_drive_connectivity.py
