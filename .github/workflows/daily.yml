name: Stock Factory - daily production run
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually ingest/process (otherwise just builds the prompt queue)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stock-factory-daily
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Paid Gemini API generation stays off unless both are set.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALLOW_PAID_GENERATION: ${{ vars.ALLOW_PAID_GENERATION }}
      # Source(s) this run pulls from. 'manual_inbox' = human-downloaded Flow
      # images committed/synced into INBOX_DIR; 'flow' is deliberately absent
      # here -- see src/stock_factory/adapters/flow_adapter.py (BLOCKED).
      ENABLED_ADAPTERS: ${{ vars.ENABLED_ADAPTERS || 'manual_inbox' }}
      DAILY_TARGET_MIN: '100'
      DAILY_TARGET_STRETCH: '150'
      DAILY_TARGET_CEILING: '200'
      # Drive archival (stage 6) stays a documented no-op until these are set.
      # OAuth (owner's own account) is the supported path for the current
      # personal My Drive folders -- see docs/ADAPTERS.md and
      # scripts/setup_drive_oauth.py. GOOGLE_SERVICE_ACCOUNT_JSON is kept
      # only for a possible future Shared Drive architecture; it will not
      # work against today's personal My Drive folders.
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_ADOBE_FOLDER_ID: ${{ vars.DRIVE_ADOBE_FOLDER_ID }}
      DRIVE_MAGNIFIC_FOLDER_ID: ${{ vars.DRIVE_MAGNIFIC_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # --- Cloud feed handoff (consumer side) ---------------------------
      # Fetches the global-trend-intelligence scan's output from the
      # dedicated `intelligence-feed` branch (published by
      # .github/workflows/trend_intelligence.yml) into this job's own
      # state/intelligence/, then verifies freshness + integrity + source
      # identification BEFORE the pipeline runs. A missing/stale/corrupt
      # feed never blocks or crashes production (--fail-soft): trends.py
      # already falls back to the static topic bank on its own when
      # load_feed()/is_feed_stale()/verify_integrity() say not to trust it
      # -- this step's job is only to make that outcome observable in the
      # run log, not to gate the job.
      - name: Fetch global-trend-intelligence feed
        shell: bash
        run: |
          mkdir -p state/intelligence
          if git ls-remote --exit-code --heads origin intelligence-feed > /dev/null 2>&1; then
            # A shallow actions/checkout only tracks the default branch under
            # refs/remotes/origin/*, so a plain `git fetch origin
            # intelligence-feed` lands in FETCH_HEAD, not
            # origin/intelligence-feed -- read it from FETCH_HEAD instead.
            git fetch --depth 1 origin intelligence-feed
            git show FETCH_HEAD:state/intelligence/feed.json > state/intelligence/feed.json 2>/dev/null || true
            git show FETCH_HEAD:state/intelligence/feed.sha256 > state/intelligence/feed.sha256 2>/dev/null || true
            echo "fetched intelligence-feed branch"
          else
            echo "::warning::intelligence-feed branch does not exist yet -- no feed to fetch"
          fi
      - name: Verify fetched feed (fail-safe -- never blocks production)
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m stock_factory.trend_intelligence.verify_feed --fail-soft

      - name: Run pipeline (dry-run unless execute requested)
        shell: bash
        env:
          MANUAL_EXECUTE: ${{ inputs.execute }}
          PYTHONPATH: src
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${MANUAL_EXECUTE}" == "true" ]]; then
            python -m stock_factory.pipeline --target "${DAILY_TARGET_MIN}" --execute
          else
            python -m stock_factory.pipeline --target "${DAILY_TARGET_MIN}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-factory-${{ github.run_id }}
          path: |
            output/
            state/
          retention-days: 30
