name: Cloudflare Workers AI - FLUX.1 Schnell Real Test
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cloudflare-flux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TIMEOUT: 60
      CLOUDFLARE_MAX_RETRIES: 3
      CLOUDFLARE_RETRY_DELAY: 2
      CLOUDFLARE_DAILY_GENERATION_CAP: 50
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_MAGNIFIC_FOLDER_ID: ${{ vars.DRIVE_MAGNIFIC_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Verify free-tier eligibility and generate real Cloudflare FLUX.1 image
        shell: bash
        env:
          PYTHONPATH: src
        run: python3 scripts/test_cloudflare_flux_real.py

      - name: Upload generated image as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-flux-test-image
          path: /tmp/cloudflare_flux_test_output.jpg
          retention-days: 7

      - name: Retrieve artifact metadata
        if: success()
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python3 << 'EOF'
          import json
          with open("/tmp/cloudflare_flux_metadata.json", "r") as f:
              metadata = json.load(f)
              print("=== CLOUDFLARE FLUX TEST RESULTS ===")
              print(f"Image size: {metadata['file_size']:,} bytes")
              print(f"Dimensions: {metadata['dimensions'][0]}x{metadata['dimensions'][1]}")
              print(f"QC Status: {'PASS' if metadata['qc_pass'] else 'FAIL'}")
              print(f"QC Reason: {metadata['qc_reason']}")
              print(f"Drive Archived: {metadata.get('drive_archived', False)}")
              if metadata.get("drive_file_id"):
                  print(f"Drive File ID: {metadata['drive_file_id']}")
              print(f"SHA256: {metadata['sha256']}")
              print("====================================")
          EOF

  upscale-pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TIMEOUT: 60
      CLOUDFLARE_MAX_RETRIES: 3
      CLOUDFLARE_RETRY_DELAY: 2
      CLOUDFLARE_DAILY_GENERATION_CAP: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run unit tests for upscale module
        shell: bash
        env:
          PYTHONPATH: src
        run: python3 -m pytest tests/test_upscale.py -v

      - name: Generate, preserve original, upscale 2x, validate
        shell: bash
        env:
          PYTHONPATH: src
        run: python3 scripts/test_upscale_pipeline.py

      - name: Upload original + upscaled images as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upscale-pipeline-outputs
          path: |
            /tmp/upscale_pipeline_original.jpg
            /tmp/upscale_pipeline_upscaled.jpg
            /tmp/upscale_pipeline_metadata.json
          retention-days: 7

      - name: Print pipeline report
        if: always()
        shell: bash
        run: |
          python3 << 'EOF'
          import json
          with open("/tmp/upscale_pipeline_metadata.json", "r") as f:
              m = json.load(f)
              ma = m.get('magnific_acceptance', {})
              print("=== RESOLUTION FIX REPORT ===")
              print(f"ORIGINAL={m['original']['dimensions'][0]}x{m['original']['dimensions'][1]}" if m['original']['dimensions'] else "ORIGINAL=")
              print(f"UPSCALE_METHOD={m['upscale_method']}")
              print(f"OUTPUT_DIMENSIONS={m['upscaled']['dimensions'][0]}x{m['upscaled']['dimensions'][1]}" if m['upscaled']['dimensions'] else "OUTPUT_DIMENSIONS=")
              print(f"OUTPUT_FILE_SIZE={m['upscaled']['file_size']}")
              print(f"DIMENSION_PRESCREEN={'PASS' if m['technical_qc']['pass'] else 'FAIL'} ({m['technical_qc']['reason']}) -- NOT submission readiness")
              print(f"MAGNIFIC_READY={'YES' if ma.get('pass') else 'NO'} ({ma.get('reason')})")
              print(f"DUPLICATE_DETECTED={m['duplicate_detected']}")
              print(f"VISUAL_REVIEW={m.get('visual_review')}")
              print(f"DRIVE_ARCHIVE={'YES' if m['drive_archived'] else 'NO'} ({m['drive_archive_reason']})")
              print(f"NEURONS_USED={m['neurons_used']}")
              print(f"ERROR={m['error']}")

              if not ma.get('pass'):
                  print("")
                  print("NOT MAGNIFIC_READY -- the upscaled file in this run's artifacts")
                  print("(upscale-pipeline-outputs: upscale_pipeline_upscaled.jpg) requires")
                  print("human visual review regardless; technical rejection does not skip it.")
          EOF

  flux2-klein-4b-eval:
    # Evaluation only: @cf/black-forest-labs/flux-2-klein-4b as a candidate
    # replacement for flux-1-schnell (rejected on visual QC). Reuses the
    # repo's existing Cloudflare secrets/vars -- no new tokens requested.
    # Never archives, never touches Drive, never affects production
    # (ENABLED_ADAPTERS/ADOBE_MARKETPLACE_ACTIVE are untouched defaults).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TIMEOUT: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Generate 3 evaluation images from flux-2-klein-4b
        shell: bash
        env:
          PYTHONPATH: src
        run: python3 scripts/test_flux2_klein_eval.py

      - name: Upload evaluation images as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux2-klein-4b-eval-outputs
          path: |
            /tmp/flux2_klein_workplace_documentary.jpg
            /tmp/flux2_klein_outdoor_lifestyle.jpg
            /tmp/flux2_klein_product_still_life.jpg
            /tmp/flux2_klein_eval_metadata.json
          retention-days: 7

      - name: Print evaluation report
        if: always()
        shell: bash
        run: |
          python3 << 'EOF'
          import json
          with open("/tmp/flux2_klein_eval_metadata.json", "r") as f:
              m = json.load(f)
          print("=== FLUX.2 [klein] 4B EVALUATION REPORT ===")
          print(f"MODEL={m['model']}")
          print(f"LICENSE={m['license']}")
          print(f"FREE_TIER={m['free_tier']}")
          print(f"NATIVE_RESOLUTION={m['native_resolution_requested']} ({m['native_resolution_note']})")
          for img in m['images']:
              dims = f"{img['dimensions'][0]}x{img['dimensions'][1]}" if img['dimensions'] else "N/A"
              print(f"IMAGE[{img['key']}]: dims={dims} bytes={img['file_size']} "
                    f"technical_qc={img['technical_qc']['pass']}({img['technical_qc']['reason']}) "
                    f"magnific_ready={img['magnific_acceptance']['pass']}({img['magnific_acceptance']['reason']}) "
                    f"drive_archived=False error={img['error']}")
          print(f"TOTAL_NEURONS_ESTIMATE={m['total_neurons_estimate']}")
          print("VISUAL_QC=PENDING_HUMAN for all three images")
          print(f"ERROR={m['error']}")
          EOF
